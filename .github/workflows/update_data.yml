name: Actualización de precios SPY
on:
  schedule:
    # Dos minutos después de cada cuarto de hora para evitar el pico de carga.
    # La ventana UTC cubre EST y EDT; el calendario NYSE decide si consultar.
    - cron: '2,17,32,47 13-20 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [SPY_componentes_base.json]
permissions:
  contents: write
concurrency:
  group: spy-data-main
  cancel-in-progress: false
jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Calendario de mercado
        run: python -m pip install --disable-pip-version-check exchange-calendars==4.13.2
      - name: Comprobar rueda (incluye feriados y cierres anticipados)
        id: market
        run: |
          echo "open=$(python market_hours.py)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Dependencias de precios
        if: steps.market.outputs.open == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/cache@v4
        if: steps.market.outputs.open == 'true'
        with:
          path: .price-cache
          key: spy-references-${{ runner.os }}-${{ steps.market.outputs.date }}
          restore-keys: spy-references-${{ runner.os }}-
      - name: Actualizar precios solo mientras la rueda esté abierta
        if: steps.market.outputs.open == 'true'
        run: python script.py precios --solo-mercado-abierto
      - name: Publicar únicamente si cambiaron los datos
        if: steps.market.outputs.open == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPY_data.json
          if git diff --staged --quiet; then
            echo "Sin cambios; no se publica."
            exit 0
          fi
          git commit -m "Actualizar precios SPY"
          # Si otra actualización avanzó main, no sobrescribirla ni forzar push.
          git push origin HEAD:main
