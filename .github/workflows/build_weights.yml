name: Ejecutable Linux para pesos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_weights.py
      - weights.py
      - launch_weights.sh
      - install_launcher.sh
      - build-requirements.txt
      - .github/workflows/build_weights.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: build-requirements.txt
      - run: pip install -r build-requirements.txt
      - run: pyinstaller --onefile --name SPY-Pesos --distpath dist --workpath build update_weights.py
      - name: Lanzador y paquete
        run: |
          cp launch_weights.sh install_launcher.sh dist/
          chmod +x dist/launch_weights.sh dist/install_launcher.sh
          tar -czf SPY-Pesos-Linux.tar.gz -C dist SPY-Pesos launch_weights.sh install_launcher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SPY-Pesos-Linux
          path: SPY-Pesos-Linux.tar.gz
      - name: Publicar ejecutable descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pesos-linux-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Actualizador de pesos Linux (${GITHUB_SHA:0:7})" --notes "Extraer el archivo, ejecutar bash install_launcher.sh y abrir Actualizar-pesos.desktop. Token de GitHub: Contents read/write solo para este repositorio." --latest
          fi
          gh release upload "$tag" SPY-Pesos-Linux.tar.gz --clobber
